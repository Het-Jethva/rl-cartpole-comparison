[project]
name = "rlcompare"
version = "1.0.0"
description = "Empirical comparison of tabular Q-learning, DQN, and REINFORCE with a baseline on CartPole-v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=2.0.0",
    "torch>=2.4.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlcompare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
